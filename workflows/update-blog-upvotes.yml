name: Update Blog Upvotes

on:
  repository_dispatch:
    types: [blog-upvote]

jobs:
  update-upvotes:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current upvotes from gist
        id: fetch
        run: |
          GIST_ID="${{ secrets.GIST_ID }}"
          response=$(curl -s "https://api.github.com/gists/$GIST_ID")
          echo "gist_response=$response" >> $GITHUB_OUTPUT

      - name: Parse and increment upvote
        id: increment
        env:
          GIST_RESPONSE: ${{ steps.fetch.outputs.gist_response }}
          POST_ID: ${{ github.event.client_payload.post_id }}
        run: |
          gist_json='${{ env.GIST_RESPONSE }}'
          content=$(echo "$gist_json" | jq -r '.files."blog-upvotes.json".content')
          upvotes=$(echo "$content" | jq .)
          
          # Increment the upvote count
          updated=$(echo "$upvotes" | jq --arg post "${{ env.POST_ID }}" '.[$post] = (.[$post] // 0) + 1')
          
          # Save to output (escaped for JSON)
          echo "updated_content=$(echo "$updated" | jq -c .)" >> $GITHUB_OUTPUT

      - name: Update gist with new upvote count
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          UPDATED_CONTENT: ${{ steps.increment.outputs.updated_content }}
        run: |
          curl -X PATCH \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" \
            -d "{
              \"files\": {
                \"blog-upvotes.json\": {
                  \"content\": $(echo '${{ env.UPDATED_CONTENT }}' | jq -Rs .)
                }
              }
            }"