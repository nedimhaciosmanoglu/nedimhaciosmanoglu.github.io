---
layout: page
title: Blog
permalink: /blog/
---

<div class="posts-grid">
{% for post in site.posts %}
  <div class="post-card">
    {% if post.thumbnail %}
      <img src="{{ post.thumbnail }}" alt="{{ post.title }}">
    {% endif %}
    <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
    <p>{{ post.excerpt }}</p>
    <button class="upvote" data-slug="{{ post.slug }}">👍 <span>0</span></button>
  </div>
{% endfor %}
</div>
